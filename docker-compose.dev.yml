services:
  db:
    image: postgres:16
    container_name: thermus-db-dev
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - thermus_pgdata_dev:/var/lib/postgresql/data

  api-dev:
    profiles: ["fullstack"]
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: thermus-api-dev
    working_dir: /src/Thermus.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:5073
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      ConnectionStrings__Default: Host=db;Port=5432;Database=appdb;Username=postgres;Password=postgres
    ports:
      - "5073:5073"
    volumes:
      - ./:/src
      - thermus_nuget_cache:/root/.nuget/packages
    command: sh -c "dotnet restore && dotnet watch run --urls http://0.0.0.0:5073"
    depends_on:
      - db

  frontend-dev:
    profiles: ["fullstack"]
    image: node:20-alpine
    container_name: thermus-frontend-dev
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - thermus_frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm start -- --host 0.0.0.0 --port 4200 --allowed-hosts=all"
    depends_on:
      - api-dev

volumes:
  thermus_pgdata_dev:
  thermus_nuget_cache:
  thermus_frontend_node_modules: